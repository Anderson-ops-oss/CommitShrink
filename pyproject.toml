[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-shrink"
version = "0.1.0"
description = "A perfectly serious developer mental-health assessment, generated from your git log."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Anderson-ops-oss" }]
keywords = ["git", "sentiment-analysis", "developer-tools", "satire", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "vaderSentiment>=3.3.2",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/Anderson-ops-oss/CommitShrink"
Repository = "https://github.com/Anderson-ops-oss/CommitShrink"
Issues = "https://github.com/Anderson-ops-oss/CommitShrink/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["streamlit>=1.38", "plotly>=5.24"]

[project.scripts]
commit-shrink = "commit_shrink.cli:main"

[tool.setuptools.packages.find]
include = ["commit_shrink*"]

[tool.setuptools.package-data]
commit_shrink = ["data/*.yaml", "data/locales/*.yaml"]
