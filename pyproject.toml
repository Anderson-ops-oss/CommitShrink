[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-shrink"
version = "0.1.0"
description = "A perfectly serious developer mental-health assessment, generated from your git log."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "vaderSentiment>=3.3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
commit-shrink = "commit_shrink.cli:main"

[tool.setuptools.packages.find]
include = ["commit_shrink*"]

[tool.setuptools.package-data]
commit_shrink = ["data/*.yaml"]
